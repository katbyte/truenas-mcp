---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # dependabot auto-detects the vendor/ directory and runs `go mod tidy` + `go mod vendor` on updates
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns:
          - "*"

  # dev tools (golangci-lint, gofumpt, actionlint) pinned in .tools/go.mod
  - package-ecosystem: "gomod"
    directory: "/.tools"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      go-tools:
        patterns:
          - "*"
