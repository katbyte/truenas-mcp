name: Workflow Action Lint

# Lints .github/workflows/ with actionlint (expression/context errors, shellcheck on run:
# blocks, action input validation). make builds actionlint at the version pinned in .tools/go.mod
# (dependabot bumps it there); its config lives in .github/actionlint.yaml.
#
# We build katbyte/actionlint, a fork of rhysd/actionlint carrying two upstream PRs that have not
# been merged: #732 (support for GitHub's `$/` self-repository `uses:` syntax) and #735
# (go.yaml.in/yaml/v4 rc.6, so actionlint and golangci-lint can share a dependency and one tools
# module). Upstream has had no commits since April 2026.

permissions:
  contents: read

on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/workflows/**'
      - '.github/actionlint*'
      - '.tools/**'
      - 'makefile'

concurrency:
  group: 'workflow-actionlint-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  workflow-actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
      # the problem matcher turns actionlint's file:line:col output into inline PR annotations
      - name: Register actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"
      # the make target passes -config-file (non-default config path) and -shellcheck=shellcheck,
      # which names the executable (preinstalled on ubuntu-latest) rather than disabling it
      - name: Run actionlint (with shellcheck) on workflow files
        run: make actionlint
