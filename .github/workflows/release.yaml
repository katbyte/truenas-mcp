---
name: release
on:
  push:
    tags: ['v*']
  # the tap formula is built from a tag's source tarball, not from the checkout,
  # so it can be regenerated for any existing tag without cutting a new release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish the Homebrew formula for, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: write # ghcr.io image push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the changelog and version from tag history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
          cache: false
      # dockers_v2 builds a multi-arch manifest with buildx and pushes it in one go, so it needs
      # qemu for the non-native platform, a buildx builder, and a ghcr.io login before running.
      # qemu and the builder are each an image, and Docker Hub turns a shared runner away once its
      # address has pulled too much: both come from Google's mirror of Docker Hub, as
      # Dockerfile.goreleaser's alpine does, and from Docker Hub itself only when the mirror gives
      # nothing. ghcr.io has neither
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        id: qemu
        continue-on-error: true
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: steps.qemu.outcome == 'failure'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        id: buildx
        continue-on-error: true
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.buildx.outcome == 'failure'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: goreleaser
    if: always() && (github.event_name == 'workflow_dispatch' || needs.goreleaser.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: update tap formula (source build)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        # invoked through bash rather than as ./script so a missing execute bit
        # cannot fail the release
        run: bash ./.scripts/update-homebrew-formula.sh

  # the binary scan (main-binary-scan.yaml) goes red on main when the published release has a known
  # vulnerability, and only a release can clear it. rerun the failed jobs of the scan runs on main's head so
  # the red check runs are replaced in place; a fresh run from a new event would sit beside them and the
  # commit would stay red
  rescan:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      actions: write # rerun workflow jobs
    steps:
      - name: rerun the failed binary scan jobs on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          runs=$(gh run list -w main-binary-scan.yaml -c "$head" --json databaseId,conclusion --jq '.[] | select(.conclusion == "failure") | .databaseId')
          if [ -z "$runs" ]; then echo "no failed binary scan on main ($head), nothing to rerun"; exit 0; fi
          for run in $runs; do echo "rerunning failed jobs of $run"; gh run rerun "$run" --failed; done
