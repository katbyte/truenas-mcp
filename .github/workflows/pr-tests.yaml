---
name: tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - '.github/workflows/pr-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the unit tests need no NAS: the connection is tested against a stand-in that behaves as the TrueNAS source says a real one does
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
      - run: make test

  # sdk/ is imported by other programs, so it must keep working on the oldest go its go.mod admits, not just the pinned toolchain
  unit-minimum-go:
    name: unit (minimum go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0' # keep in sync with the go directive in go.mod
      - run: GOTOOLCHAIN=local make test
